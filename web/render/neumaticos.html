<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Render de los neumáticos de precio · Karting Villafranca</title>
<!-- El neumático de su cartel de tarifas, de frente: caucho con grano, la banda del color de cada tarifa
     (su mismo código: verde, naranja, amarillo, rojo, rosa) y la llanta clara donde la web escribe el precio.
     Salen con fondo transparente en #salida (Edge sin ventana, --dump-dom). -->
<style>body{margin:0}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<textarea id="salida"></textarea>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const PX = 420;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true, premultipliedAlpha: false });
renderer.setClearColor(0, 0); renderer.setSize(PX, PX, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
const sol = new THREE.DirectionalLight(0xffffff, 2.2); sol.position.set(-.7, 1.2, 1.4); scene.add(sol);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d4cc, .7));

let s = 3; const azar = () => ((s = (s * 16807) % 2147483647) / 2147483647);
const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const im = g.createImageData(256, 256);
for (let i = 0; i < im.data.length; i += 4) { const v = 118 + azar() * 34; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
g.putImageData(im, 0, 0); const grano = new THREE.CanvasTexture(c); grano.wrapS = grano.wrapT = THREE.RepeatWrapping; grano.repeat.set(3, 3);

const caucho = new THREE.MeshPhysicalMaterial({ color: 0x141414, roughness: .62, clearcoat: .2, clearcoatRoughness: .4, bumpMap: grano, bumpScale: .5, sheen: .25, sheenColor: new THREE.Color(0x404040) });
const llanta = new THREE.MeshPhysicalMaterial({ color: 0xdcdcd8, metalness: .75, roughness: .32, clearcoat: .6, clearcoatRoughness: .2 });
const buje = new THREE.MeshPhysicalMaterial({ color: 0x8e9194, metalness: .9, roughness: .25 });

// pieza de revolución de frente: perfil [radio, altura hacia la cámara], UV en plano
function frente(perfil, mat, seg = 220) {
  const geo = new THREE.LatheGeometry(perfil.map(([r, h]) => new THREE.Vector2(r, h)), seg);
  geo.rotateX(Math.PI / 2);
  const p = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / 220 + .5, p.getY(i) / 220 + .5);
  return new THREE.Mesh(geo, mat);
}
function neumatico(color) {
  const grupo = new THREE.Group();
  // flanco grueso: hombro redondeado, cae hacia una llanta pequeña (como un neumático de kart)
  const flanco = [[100, 0]];
  for (let k = 1; k <= 12; k++) { const a = k / 12 * Math.PI / 2; flanco.push([90 + 10 * Math.cos(a), 12 * Math.sin(a)]); }
  flanco.push([82, 14.5], [62, 15], [54, 13.6], [51, 12]);
  grupo.add(frente(flanco, caucho));
  // tacos del hombro: se ven de frente como dientes en el borde
  const taco = new THREE.BoxGeometry(5.2, 9, 8);
  const tacos = new THREE.InstancedMesh(taco, caucho, 40); const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Vector3(1, 1, 1);
  for (let i = 0; i < 40; i++) { const t = i / 40 * Math.PI * 2; q.setFromAxisAngle(new THREE.Vector3(0, 0, 1), t); m.compose(new THREE.Vector3(Math.cos(t + Math.PI / 2) * -97.5, Math.sin(t + Math.PI / 2) * -97.5, 4), q, e); tacos.setMatrixAt(i, m); }
  grupo.add(tacos);
  // la banda del compuesto, en relieve sobre el flanco
  const mat = new THREE.MeshPhysicalMaterial({ color, roughness: .45, clearcoat: .5, clearcoatRoughness: .25 });
  const banda = []; for (let k = 0; k <= 14; k++) { const a = k / 14 * Math.PI; banda.push([70 + 3.6 * Math.cos(a), 15 + 1.5 * Math.sin(a)]); }
  grupo.add(frente(banda, mat));
  // llanta de magnesio: pestaña, plato plano con 6 agujeros de aligerado y 3 tornillos
  const ll = [[51.5, 11]]; for (let k = 0; k <= 10; k++) { const a = k / 10 * Math.PI; ll.push([48.5 + 3 * Math.cos(a), 11 + 3.2 * Math.sin(a)]); }
  ll.push([45, 10.8], [0, 10.2]);
  grupo.add(frente(ll, llanta));
  const hueco = new THREE.MeshPhysicalMaterial({ color: 0x1a1a1a, roughness: .7 });
  for (let i = 0; i < 6; i++) { const t = i / 6 * Math.PI * 2 + .26; const h = new THREE.Mesh(new THREE.CircleGeometry(6.4, 40), hueco); h.position.set(Math.cos(t) * 36, Math.sin(t) * 36, 10.6); grupo.add(h);
    const aro = new THREE.Mesh(new THREE.TorusGeometry(6.6, .9, 8, 40), llanta); aro.position.copy(h.position); aro.position.z = 10.7; grupo.add(aro); }
  for (let i = 0; i < 3; i++) { const t = i / 3 * Math.PI * 2 + 1.3; const tor = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 2, 6), buje); tor.rotation.x = Math.PI / 2; tor.position.set(Math.cos(t) * 24, Math.sin(t) * 24, 11.5); grupo.add(tor); }
  return grupo;
}
const COLORES = { tanda: 0x5DBB46, mini: 0xF39A1E, gp: 0xF2D21B, super: 0xE2343F, pase: 0xE2549B };
const cam = new THREE.OrthographicCamera(-104, 104, 104, -104, 1, 1000); cam.position.set(0, 0, 400); cam.lookAt(0, 0, 0);
const salida = {};
for (const [n, col] of Object.entries(COLORES)) {
  const o = neumatico(col); scene.add(o); renderer.render(scene, cam);
  salida[n] = renderer.domElement.toDataURL('image/png'); scene.remove(o);
}
document.getElementById('salida').textContent = JSON.stringify(salida);
document.title = 'LISTO';
</script>
</body>
</html>
